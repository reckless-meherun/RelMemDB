experiment:
  name: exp03_continent_inverse
  seed: 2025

model:
  name: gpt2
  native_layers: 12
  hidden_size: 768
  attention_heads: 12
  context_length: 256
  precision: bf16

data:
  schema_topology: single_table
  table: continent
  facts_per_row: 2
  max_rows_per_climate_band: 2

training:
  cpt_batch_size: 32
  cpt_epochs: 20
  gradient_accumulation_steps: 1
  optimizer: adamw
  learning_rate: 3.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  scheduler: cosine
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  context_length: 512
  precision: bf16
  shuffle: true
  gradient_checkpointing: false
  fused_optimizer: true
  dataloader_workers: 2
  pin_memory: true
  drop_last: false

target_sft:
  dataset_dir: target_sft
  training_split: train
  batch_size: 32
  gradient_accumulation_steps: 1
  epochs: 10
  context_length: 128
  optimizer: adamw
  learning_rate: 2.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  scheduler: cosine
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  precision: bf16
  shuffle: true
  gradient_checkpointing: false
  fused_optimizer: true
  dataloader_workers: 2
  pin_memory: true
  drop_last: false
  answer_only_loss: true
  supervise_eos: true

evaluation:
  decoding: greedy
  temperature: 0.0
  primary_metric: normalized_exact_match
  batch_size: 32
  context_length: 256
  max_new_tokens: 64
