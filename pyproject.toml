[project]
name = "relmemdb"
version = "0.1.0"
description = "Research utilities for relational memory experiments"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.2",
    "transformers>=4.45,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
